[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vendor-contract-compliance"
version = "0.2.0"
description = "Deterministic audit of a synthetic vendor contract"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24", "pydantic>=2.0", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
agentic = ["langgraph>=0.6,<2", "openai>=1.99,<3"]

[project.scripts]
vendor-contract-audit = "vendor_contract_compliance.cli:main"
vendor-contract-agentic = "vendor_contract_compliance.agentic_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
