name: Phase 3 Multi-Provider Live Model Evidence
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Explicit model provider
        required: true
        type: choice
        default: openrouter
        options:
          - openai
          - openrouter
          - gemini
      model:
        description: Optional provider model override
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: phase3-live-model-${{ inputs.provider }}
  cancel-in-progress: false
jobs:
  one-model-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SELECTED_PROVIDER: ${{ inputs.provider }}
      MODEL_OVERRIDE: ${{ inputs.model }}
      OPENAI_API_KEY: ${{ inputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
      OPENROUTER_API_KEY: ${{ inputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
      GEMINI_API_KEY: ${{ inputs.provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate selected configuration without printing secrets
        shell: bash
        run: |
          case "$SELECTED_PROVIDER" in
            openai) resolved_model="${MODEL_OVERRIDE:-gpt-5.6-luna}"; test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY is not configured'; exit 1; } ;;
            openrouter) resolved_model="${MODEL_OVERRIDE:-openai/gpt-5.6-luna}"; test -n "$OPENROUTER_API_KEY" || { echo 'OPENROUTER_API_KEY is not configured'; exit 1; } ;;
            gemini) resolved_model="${MODEL_OVERRIDE:-gemini-3.6-flash}"; test -n "$GEMINI_API_KEY" || { echo 'GEMINI_API_KEY is not configured'; exit 1; } ;;
            *) echo 'Invalid provider input'; exit 1 ;;
          esac
          [[ "$resolved_model" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{2,99}$ ]] || { echo 'Invalid model input'; exit 1; }
          echo "RESOLVED_MODEL=$resolved_model" >> "$GITHUB_ENV"
      - run: python -m pip install -e '.[test,agentic]'
      - run: python scripts/generate_synthetic_contract.py
      - name: Run exactly one explicitly selected provider audit
        id: audit
        continue-on-error: true
        run: >-
          python -m vendor_contract_compliance.agentic_cli
          --contract samples/synthetic_vendor_contract.pdf
          --policies policies/demo_policies.yaml
          --output-dir "evidence/phase3/${SELECTED_PROVIDER}-manual"
          --client "$SELECTED_PROVIDER" --model "$RESOLVED_MODEL"
      - name: Verify sanitized evidence
        env:
          EVIDENCE_PATH: evidence/phase3/${{ inputs.provider }}-manual/agentic_run.json
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open(os.environ['EVIDENCE_PATH']))
          provider=os.environ['SELECTED_PROVIDER']; model=os.environ['RESOLVED_MODEL']
          expected=[['POL-001','PASS','LOW'],['POL-002','GAP','HIGH'],['POL-003','MISSING','HIGH'],['POL-004','GAP','MEDIUM'],['POL-005','REVIEW','MEDIUM']]
          assert p['provider']==provider and p['client_type']==provider and p['model']==model
          assert p['route_status']=='APPROVED' and p['reviewer_decision']=='APPROVE' and p['error'] is None
          assert [[f['policy_id'],f['status'],f['severity']] for f in p['findings']]==expected
          tools=['extract_pdf_pages','extract_contract_clauses','load_demo_policies','run_deterministic_rules','write_agentic_report']
          assert [e['tool_name'] for e in p['tool_events']]==tools and all(e['success'] for e in p['tool_events'])
          assert p['graph_path']==['orchestrator','contract_analyst','compliance_analyst','independent_reviewer','report_builder']
          PY
          echo "### Phase 3 ${SELECTED_PROVIDER} manual model check" >> "$GITHUB_STEP_SUMMARY"
          echo "One explicitly selected ${SELECTED_PROVIDER} run completed and sanitized evidence was verified." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-${{ inputs.provider }}-sanitized-evidence-attempt-${{ github.run_attempt }}
          path: evidence/phase3/${{ inputs.provider }}-manual/
          if-no-files-found: warn
      - name: Enforce approved result
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          EVIDENCE_PATH: evidence/phase3/${{ inputs.provider }}-manual/agentic_run.json
        run: |
          test "$AUDIT_OUTCOME" = success
          python -c "import json,os; assert json.load(open(os.environ['EVIDENCE_PATH']))['route_status'] == 'APPROVED'"
